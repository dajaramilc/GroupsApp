# ══════════════════════════════════════════════════════════
# GroupsApp – Microservices Architecture
# 7 independent services + 1 API Gateway + 1 shared DB
# ══════════════════════════════════════════════════════════

networks:
  groupsapp-net:
    driver: bridge

volumes:
  pgdata:
  uploads:

services:

  # ── Shared PostgreSQL (single DB for now, split later) ──
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: groupsapp
      POSTGRES_PASSWORD: groupsapp
      POSTGRES_DB: groupsapp
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - groupsapp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupsapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── RabbitMQ (MOM – Message-Oriented Middleware) ────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - groupsapp-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── API Gateway ─────────────────────────────────────────
  api-gateway:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./static/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - svc-auth
      - svc-users
      - svc-groups
      - svc-channels
      - svc-messages
      - svc-files
      - svc-presence
    networks:
      - groupsapp-net
    restart: unless-stopped

  # ── Auth ────────────────────────────────────────────────
  svc-auth:
    build:
      context: .
      dockerfile: services/svc-auth/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://groupsapp:groupsapp@db:5432/groupsapp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - groupsapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Users ───────────────────────────────────────────────
  svc-users:
    build:
      context: .
      dockerfile: services/svc-users/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://groupsapp:groupsapp@db:5432/groupsapp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - groupsapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Groups ──────────────────────────────────────────────
  svc-groups:
    build:
      context: .
      dockerfile: services/svc-groups/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://groupsapp:groupsapp@db:5432/groupsapp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8003"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - groupsapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Channels ────────────────────────────────────────────
  svc-channels:
    build:
      context: .
      dockerfile: services/svc-channels/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://groupsapp:groupsapp@db:5432/groupsapp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8004"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - groupsapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Messages ────────────────────────────────────────────
  svc-messages:
    build:
      context: .
      dockerfile: services/svc-messages/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://groupsapp:groupsapp@db:5432/groupsapp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8005"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - groupsapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Files ───────────────────────────────────────────────
  svc-files:
    build:
      context: .
      dockerfile: services/svc-files/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://groupsapp:groupsapp@db:5432/groupsapp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8006"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - groupsapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Presence ────────────────────────────────────────────
  svc-presence:
    build:
      context: .
      dockerfile: services/svc-presence/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://groupsapp:groupsapp@db:5432/groupsapp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      PRESENCE_TIMEOUT_SECONDS: ${PRESENCE_TIMEOUT_SECONDS:-120}
    expose:
      - "8007"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - groupsapp-net
    restart: unless-stopped

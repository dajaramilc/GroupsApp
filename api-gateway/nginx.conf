events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Upstream definitions ──────────────────────────────
    upstream svc_auth     { server svc-auth:8001; }
    upstream svc_users    { server svc-users:8002; }
    upstream svc_groups   { server svc-groups:8003; }
    upstream svc_channels { server svc-channels:8004; }
    upstream svc_messages { server svc-messages:8005; }
    upstream svc_files    { server svc-files:8006; }
    upstream svc_presence { server svc-presence:8007; }

    server {
        listen 80;
        server_name _;

        # ── Health check for the gateway itself ────────────
        location = /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ── Static frontend files ──────────────────────────
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # ══════════════════════════════════════════════════
        # ROUTING – regex locations take priority over prefix
        # ══════════════════════════════════════════════════

        # ── Messages within channels  (/channels/{id}/messages*)
        location ~ ^/channels/[^/]+/messages {
            proxy_pass http://svc_messages;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Messages sent to a user  (/users/{id}/messages*)
        location ~ ^/users/[^/]+/messages {
            proxy_pass http://svc_messages;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Presence check for a user  (/users/{id}/presence)
        location ~ ^/users/[^/]+/presence {
            proxy_pass http://svc_presence;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Channels within a group  (/groups/{id}/channels*)
        location ~ ^/groups/[^/]+/channels {
            proxy_pass http://svc_channels;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ══════════════════════════════════════════════════
        # Prefix routing – NOTE: proxy_pass with upstream
        # name preserves the full URI automatically.
        # ══════════════════════════════════════════════════

        location /auth {
            proxy_pass http://svc_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /users {
            proxy_pass http://svc_users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /groups {
            proxy_pass http://svc_groups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /channels {
            proxy_pass http://svc_channels;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /messages {
            proxy_pass http://svc_messages;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /conversations {
            proxy_pass http://svc_messages;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /attachments {
            proxy_pass http://svc_files;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /presence {
            proxy_pass http://svc_presence;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Fallback for unmatched routes
        location / {
            return 404 '{"detail":"Route not found in gateway"}';
            add_header Content-Type application/json;
        }
    }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-groups
  namespace: groupsapp
  labels: { app: svc-groups }
spec:
  replicas: 1
  selector:
    matchLabels: { app: svc-groups }
  template:
    metadata:
      labels: { app: svc-groups }
    spec:
      containers:
        - name: svc-groups
          image: dajaramilc/groupsapp-svc-groups:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: svc-groups
  namespace: groupsapp
spec:
  selector: { app: svc-groups }
  ports:
    - port: 8003
      targetPort: 8003

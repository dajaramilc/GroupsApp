# NO COMMITEAR VALORES REALES.
# En producción, crear el Secret directamente con kubectl:
#
#   kubectl -n groupsapp create secret generic app-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=JWT_ALGORITHM=HS256 \
#     --from-literal=JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440 \
#     --from-literal=CORS_ORIGINS='*' \
#     --from-literal=PRESENCE_TIMEOUT_SECONDS=120 \
#     --from-literal=MAX_UPLOAD_SIZE_MB=10 \
#     --from-literal=UPLOAD_DIR=/app/uploads
#
# Este archivo se mantiene como referencia de la forma del Secret pero con
# placeholders. Para deploys locales/CI usar variables o un secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: groupsapp
type: Opaque
stringData:
  DATABASE_URL: "REEMPLAZAR_postgresql+asyncpg://USER:PASS@HOST:PORT/DB"
  JWT_SECRET_KEY: "REEMPLAZAR_openssl_rand_hex_32"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  CORS_ORIGINS: "*"
  PRESENCE_TIMEOUT_SECONDS: "120"
  MAX_UPLOAD_SIZE_MB: "10"
  UPLOAD_DIR: "/app/uploads"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  SVC_CHANNELS_GRPC_ADDR: "svc-channels:50051"

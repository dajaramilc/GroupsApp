apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
  namespace: groupsapp
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        upstream svc_auth     { server svc-auth:8001; }
        upstream svc_users    { server svc-users:8002; }
        upstream svc_groups   { server svc-groups:8003; }
        upstream svc_channels { server svc-channels:8004; }
        upstream svc_messages { server svc-messages:8005; }
        upstream svc_files    { server svc-files:8006; }
        upstream svc_presence { server svc-presence:8007; }

        server {
            listen 80;
            server_name _;
            client_max_body_size 25M;

            location = /health {
                add_header Content-Type application/json always;
                add_header Access-Control-Allow-Origin '*' always;
                return 200 '{"status":"ok","service":"api-gateway"}';
            }

            # Regex locations (priority)
            location ~ ^/channels/[^/]+/messages {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_messages;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location ~ ^/users/[^/]+/messages {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_messages;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location ~ ^/users/[^/]+/presence {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_presence;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location ~ ^/groups/[^/]+/channels {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_channels;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }

            # Prefix routing
            location /auth {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_auth;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location /users {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_users;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location /groups {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_groups;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location /channels {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_channels;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location /messages {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_messages;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location /conversations {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_messages;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location /attachments {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_files;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }
            location /presence {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin '*' always;
                    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
                    add_header Access-Control-Max-Age 86400 always;
                    return 204;
                }
                add_header Access-Control-Allow-Origin '*' always;
                proxy_pass http://svc_presence;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
            }

            location / {
                return 404 '{"detail":"Route not found in gateway"}';
                add_header Content-Type application/json;
            }
        }
    }

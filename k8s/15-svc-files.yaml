apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-files
  namespace: groupsapp
  labels: { app: svc-files }
spec:
  replicas: 1
  selector:
    matchLabels: { app: svc-files }
  template:
    metadata:
      labels: { app: svc-files }
    spec:
      containers:
        - name: svc-files
          image: dajaramilc/groupsapp-svc-files:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          envFrom:
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /health, port: 8006 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: svc-files
  namespace: groupsapp
spec:
  selector: { app: svc-files }
  ports:
    - port: 8006
      targetPort: 8006

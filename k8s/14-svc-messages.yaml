apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-messages
  namespace: groupsapp
  labels: { app: svc-messages }
spec:
  replicas: 1
  selector:
    matchLabels: { app: svc-messages }
  template:
    metadata:
      labels: { app: svc-messages }
    spec:
      containers:
        - name: svc-messages
          image: dajaramilc/groupsapp-svc-messages:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          envFrom:
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "500m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: svc-messages
  namespace: groupsapp
spec:
  selector: { app: svc-messages }
  ports:
    - port: 8005
      targetPort: 8005
